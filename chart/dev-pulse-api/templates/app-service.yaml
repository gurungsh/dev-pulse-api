apiVersion: v1
kind: Service
metadata:
  name: {{ include "dev-pulse-api.name" . }}
  labels:
    {{- include "dev-pulse-api.labels" . | nindent 4 }}
    {{- include "dev-pulse-api.appSelectorLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "dev-pulse-api.appSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.app.port }}
      targetPort: http
