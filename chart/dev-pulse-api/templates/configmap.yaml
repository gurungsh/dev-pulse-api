# Non-secret settings, read by both the app and PostgreSQL.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dev-pulse-api.name" . }}-config
  labels:
    {{- include "dev-pulse-api.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.app.port | quote }}
  POSTGRESQL_DATABASE: {{ .Values.postgresql.database | quote }}
