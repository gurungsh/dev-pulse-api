# Headless service: gives the StatefulSet pod a stable DNS name (<release>-postgresql).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dev-pulse-api.postgresqlName" . }}
  labels:
    {{- include "dev-pulse-api.labels" . | nindent 4 }}
    {{- include "dev-pulse-api.postgresqlSelectorLabels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "dev-pulse-api.postgresqlSelectorLabels" . | nindent 4 }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
