{{- if .Values.route.enabled }}
# OpenShift's equivalent of an Ingress. TLS ends at the router; plain HTTP is redirected to HTTPS.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "dev-pulse-api.name" . }}
  labels:
    {{- include "dev-pulse-api.labels" . | nindent 4 }}
    {{- include "dev-pulse-api.appSelectorLabels" . | nindent 4 }}
spec:
  {{- with .Values.route.host }}
  host: {{ . }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "dev-pulse-api.name" . }}
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
