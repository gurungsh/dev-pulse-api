{{- $user := required "postgresql.user is required (--set-string postgresql.user=...)" .Values.postgresql.user -}}
{{- $password := required "postgresql.password is required (--set-string postgresql.password=...)" .Values.postgresql.password -}}
# The database credentials, plus the app's connection string built from them.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dev-pulse-api.name" . }}-secret
  labels:
    {{- include "dev-pulse-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRESQL_USER: {{ $user | quote }}
  POSTGRESQL_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s" $user ($password | urlquery) (include "dev-pulse-api.postgresqlName" .) .Values.postgresql.database | quote }}
