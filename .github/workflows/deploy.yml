name: Deploy dev-pulse-api to OpenShift

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE: ghcr.io/gurungsh/dev-pulse-api
  NAMESPACE: gurungsh-dev
  RELEASE: dev-pulse-api

jobs:
    ci:
        uses: ./.github/workflows/ci.yml

    build:
        needs: ci
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write
        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Login to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build and push image
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: |
              ${{ env.IMAGE }}:${{ github.sha }}
              ${{ env.IMAGE }}:latest

    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Install OpenShift CLI (oc)
          uses: redhat-actions/openshift-tools-installer@v1
          with:
            oc: 'latest'

        - name: Install Helm
          uses: azure/setup-helm@v4

        - name: Login to OpenShift
          uses: redhat-actions/oc-login@v2
          with:
            openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
            openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
            namespace: ${{ env.NAMESPACE }}
            insecure_skip_tls_verify: true

        # Earlier versions of this workflow created the app with `oc new-app`, using the same
        # names as the chart. Helm won't adopt resources it didn't create, so remove those once.
        # This only touches the stateless app; the old `postgresql` database is left alone.
        - name: Remove resources from the old oc new-app deploy
          run: |
            managed_by=$(oc get deployment "$RELEASE" -o jsonpath='{.metadata.labels.app\.kubernetes\.io/managed-by}' 2>/dev/null || true)
            if oc get deployment "$RELEASE" >/dev/null 2>&1 && [ "$managed_by" != "Helm" ]; then
              oc delete deployment,service,route,buildconfig,imagestream "$RELEASE" --ignore-not-found
            fi

        - name: Deploy with Helm
          env:
            POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          run: |
            helm upgrade --install "$RELEASE" ./chart/dev-pulse-api \
              --namespace "$NAMESPACE" \
              --set app.image.tag="${{ github.sha }}" \
              --set-string postgresql.user="$POSTGRES_USER" \
              --set-string postgresql.password="$POSTGRES_PASSWORD" \
              --wait --timeout 10m

            echo "URL: https://$(oc get route "$RELEASE" -o jsonpath='{.spec.host}')/api/v1/services"
