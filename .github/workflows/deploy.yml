name: Deploy dev-pulse-api to OpenShift

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Install OpenShift CLI (oc)
          uses: redhat-actions/openshift-tools-installer@v1
          with:
            oc: 'latest'

        - name: Login to OpenShift
          uses: redhat-actions/oc-login@v2
          with:
            openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
            openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
            namespace: 'gurungsh-dev'
            insecure_skip_tls_verify: true

        - name: Deploy PostgreSQL
          env:
            POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          run: |
            oc create secret generic postgres-credentials \
            --from-literal=POSTGRESQL_USER=devpulse \
            --from-literal=POSTGRESQL_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=POSTGRESQL_DATABASE=devpulse \
            --dry-run=client -o yaml | oc apply -f -

            oc apply -f openshift/postgres.yaml

            oc rollout status deployment/postgresql --timeout=5m

        - name: Deploy Application in OpenShift
          env:
            POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          run: |
            oc create secret generic api-db-secret \
            --from-literal=DATABASE_URL="postgresql://devpulse:${POSTGRES_PASSWORD}@postgresql:5432/devpulse" \
            --from-literal=PORT=8080 \
            --dry-run=client -o yaml | oc apply -f -

            # First run: new-app creates the BuildConfig and starts the first build itself.
            # Later runs: rebuild from the latest commit.
            if oc get bc/dev-pulse-api >/dev/null 2>&1; then
              oc start-build dev-pulse-api --follow
            else
              oc new-app https://github.com/gurungsh/dev-pulse-api.git --name=dev-pulse-api
              oc logs -f bc/dev-pulse-api
            fi

            oc set env deployment/dev-pulse-api --from=secret/api-db-secret

            oc expose service/dev-pulse-api || true

            oc rollout status deployment/dev-pulse-api --timeout=5m
